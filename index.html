<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alien Terminal Menu</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="terminal">
    <div class="sidebar">
      <h2>FOLDERS</h2>
      <ul id="folder-list"></ul>
      <div class="folder-actions">
        <button id="add-folder">+ NEW FOLDER</button>
        <button id="reset-folders">↺ RESET</button>
      </div>
    </div>

    <div class="main">
      <div class="terminal-header">
        <span class="terminal-label">FOLDER ACCESS</span>
        <span id="folder-status">ONLINE</span>
      </div>

      <h1 id="section-title">Files</h1>
      <div id="typewriter-text" class="description"></div>

      <div class="folder-controls">
        <button id="edit-folder">EDIT</button>
        <button id="rename-folder">RENAME</button>
        <button id="delete-folder">DELETE</button>
      </div>

      <div id="folder-editor" class="folder-editor hidden">
        <div class="editor-header">EDIT FOLDER DATA</div>
        <label for="edit-title">TITLE</label>
        <input id="edit-title" type="text" autocomplete="off" />
        <label for="edit-description">CONTENT</label>
        <textarea id="edit-description" rows="8" spellcheck="false"></textarea>
        <div class="editor-controls">
          <button id="save-folder">SAVE</button>
          <button id="cancel-edit">CANCEL</button>
        </div>
      </div>

      <div id="terminal-dialog" class="terminal-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <div class="dialog-header">
          <span id="dialog-type">TERMINAL INPUT</span>
          <span>ESC: ABORT</span>
        </div>
        <h2 id="dialog-title">NEW FOLDER</h2>
        <div id="dialog-fields"></div>
        <div id="dialog-message"></div>
        <div class="dialog-controls">
          <button id="dialog-primary">EXECUTE</button>
          <button id="dialog-cancel">ABORT</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
