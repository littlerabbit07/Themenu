<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alien Terminal Menu</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .terminal-dialog{position:absolute;z-index:50;left:50%;top:50%;transform:translate(-50%,-50%);width:min(620px,calc(100% - 3rem));box-sizing:border-box;padding:1.25rem;background:rgba(0,8,2,.97);border:1px solid #33ff66;box-shadow:0 0 8px rgba(51,255,102,.5),inset 0 0 25px rgba(51,255,102,.06);animation:dialog-open .12s steps(2,start)}
    .terminal-dialog.hidden{display:none}.dialog-header{display:flex;justify-content:space-between;gap:1rem;padding-bottom:.5rem;border-bottom:1px solid rgba(51,255,102,.5);font-size:.65rem;letter-spacing:.12em;opacity:.8}.terminal-dialog h2{font-size:1rem;letter-spacing:.08em;margin:1rem 0}#dialog-message{margin:.5rem 0 1rem;font-size:.8rem;line-height:1.5}.dialog-controls{display:flex;gap:.6rem;margin-top:1rem}.dialog-controls button{position:relative;overflow:hidden;background:rgba(0,12,4,.75);border:1px solid #33ff66;color:#33ff66;padding:.5rem 1rem;font-family:'Courier New',monospace;cursor:pointer;text-shadow:0 0 5px #33ff66;box-shadow:0 0 4px rgba(51,255,102,.25)}.dialog-controls button:focus-visible{outline:1px solid #ccffdd;box-shadow:0 0 10px rgba(51,255,102,.7)}#dialog-fields label{display:block;margin:.75rem 0 .3rem;font-size:.65rem;letter-spacing:.1em;opacity:.75}#dialog-fields input,#dialog-fields textarea{width:100%;box-sizing:border-box;background:rgba(0,15,5,.95);border:1px solid rgba(51,255,102,.65);color:#33ff66;padding:.65rem;font-family:'Courier New',monospace;font-size:.85rem;outline:none;resize:vertical;text-shadow:0 0 5px #33ff66;box-shadow:inset 0 0 12px rgba(51,255,102,.06)}#dialog-fields input:focus,#dialog-fields textarea:focus{border-color:#ccffdd;box-shadow:0 0 8px rgba(51,255,102,.45),inset 0 0 12px rgba(51,255,102,.1)}@keyframes dialog-open{from{opacity:0;transform:translate(-50%,-50%) scale(.99)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  </style>
</head>
<body>
  <div class="terminal">
    <div class="sidebar">
      <h2>FOLDERS</h2>
      <ul id="folder-list"></ul>
      <div class="folder-actions">
        <button id="add-folder">+ NEW FOLDER</button>
        <button id="reset-folders">↺ RESET</button>
      </div>
    </div>
    <div class="main">
      <div class="terminal-header"><span class="terminal-label">FOLDER ACCESS</span><span id="folder-status">ONLINE</span></div>
      <h1 id="section-title">Files</h1>
      <div id="typewriter-text" class="description"></div>
      <div class="folder-controls"><button id="edit-folder">EDIT</button><button id="rename-folder">RENAME</button><button id="delete-folder">DELETE</button></div>
      <div id="folder-editor" class="folder-editor hidden">
        <div class="editor-header">EDIT FOLDER DATA</div>
        <label for="edit-title">TITLE</label><input id="edit-title" type="text" autocomplete="off" />
        <label for="edit-description">CONTENT</label><textarea id="edit-description" rows="8" spellcheck="false"></textarea>
        <div class="editor-controls"><button id="save-folder">SAVE</button><button id="cancel-edit">CANCEL</button></div>
      </div>
      <div id="terminal-dialog" class="terminal-dialog hidden" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <div class="dialog-header"><span id="dialog-type">TERMINAL INPUT</span><span>ESC: ABORT</span></div>
        <h2 id="dialog-title">NEW FOLDER</h2>
        <div id="dialog-fields"></div><div id="dialog-message"></div>
        <div class="dialog-controls"><button id="dialog-primary">EXECUTE</button><button id="dialog-cancel">ABORT</button></div>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
